{% extends "tours/base.html" %}
{% block content %}
<div class="auth-box">
  <h2>Log in</h2>
  {% if messages %}
    {% for message in messages %}<p class="error">{{ message }}</p>{% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p>No account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
